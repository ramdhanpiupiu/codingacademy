<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Ilustrasi: Workshop Web Development - jendela browser + kode HTML/CSS -->
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="1" stop-color="#302b63"/>
    </linearGradient>
    <pattern id="grid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#00d4ff" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <rect width="600" height="400" fill="url(#grid1)"/>
  <!-- Simbol </> besar di latar -->
  <text x="300" y="250" text-anchor="middle" font-family="monospace" font-size="180" font-weight="bold" fill="#00d4ff" opacity="0.12">&lt;/&gt;</text>
  <!-- Jendela browser -->
  <rect x="110" y="70" width="380" height="260" rx="14" fill="#1e1e2c" stroke="#00d4ff" stroke-width="2.5"/>
  <rect x="110" y="70" width="380" height="42" rx="14" fill="#2a2a3c"/>
  <rect x="110" y="96" width="380" height="16" fill="#2a2a3c"/>
  <circle cx="134" cy="91" r="6" fill="#ff5f57"/>
  <circle cx="154" cy="91" r="6" fill="#febc2e"/>
  <circle cx="174" cy="91" r="6" fill="#28c840"/>
  <rect x="200" y="82" width="220" height="18" rx="9" fill="#0f0c29" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
  <text x="300" y="95" text-anchor="middle" font-family="monospace" font-size="11" fill="#00d4ff">localhost: workshop-web</text>
  <!-- Isi kode -->
  <text x="140" y="145" font-family="monospace" font-size="16" fill="#ff7edb">&lt;html&gt;</text>
  <text x="160" y="172" font-family="monospace" font-size="15" fill="#00d4ff">&lt;h1&gt; Halo Dunia! &lt;/h1&gt;</text>
  <text x="160" y="199" font-family="monospace" font-size="15" fill="#7CFC98">.btn { color: cyan; }</text>
  <text x="160" y="226" font-family="monospace" font-size="15" fill="#febc2e">function mulai() {</text>
  <text x="180" y="253" font-family="monospace" font-size="15" fill="#ffffff">  belajar.koding();</text>
  <text x="160" y="280" font-family="monospace" font-size="15" fill="#febc2e">}</text>
  <text x="140" y="307" font-family="monospace" font-size="16" fill="#ff7edb">&lt;/html&gt;</text>
  <!-- Kursor -->
  <rect x="300" y="266" width="10" height="18" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
