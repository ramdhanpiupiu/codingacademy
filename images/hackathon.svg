<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Ilustrasi: Hackathon Mini - piala + timer 24 jam -->
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160a2e"/>
      <stop offset="1" stop-color="#3b1163"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg5)"/>
  <!-- Confetti -->
  <g opacity="0.5">
    <rect x="80" y="60" width="10" height="10" fill="#ff5f57" transform="rotate(20 80 60)"/>
    <rect x="140" y="90" width="10" height="10" fill="#00d4ff" transform="rotate(-15 140 90)"/>
    <rect x="470" y="70" width="10" height="10" fill="#f7df1e" transform="rotate(30 470 70)"/>
    <rect x="520" y="120" width="10" height="10" fill="#50fa7b" transform="rotate(-25 520 120)"/>
    <circle cx="110" cy="300" r="6" fill="#ff7edb"/>
    <circle cx="495" cy="300" r="6" fill="#00d4ff"/>
  </g>
  <!-- Stopwatch / timer -->
  <circle cx="150" cy="110" r="45" fill="#1e1e3c" stroke="#00d4ff" stroke-width="3"/>
  <text x="150" y="120" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#00d4ff">24</text>
  <text x="150" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#bbb">JAM</text>
  <rect x="145" y="55" width="10" height="12" fill="#00d4ff"/>
  <!-- Piala -->
  <g>
    <path d="M260 110 h80 v50 q0 45 -40 45 q-40 0 -40 -45 Z" fill="#ffd343" stroke="#b8860b" stroke-width="3"/>
    <path d="M260 120 q-40 0 -40 30 q0 30 40 30" fill="none" stroke="#ffd343" stroke-width="8" stroke-linecap="round"/>
    <path d="M340 120 q40 0 40 30 q0 30 -40 30" fill="none" stroke="#ffd343" stroke-width="8" stroke-linecap="round"/>
    <rect x="293" y="205" width="14" height="30" fill="#b8860b"/>
    <rect x="275" y="235" width="50" height="12" rx="3" fill="#ffd343"/>
    <text x="300" y="155" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#7a5200">⌨</text>
  </g>
  <!-- Skor/tim -->
  <rect x="120" y="290" width="360" height="60" rx="12" fill="#1e1e3c" stroke="#00d4ff" stroke-width="2"/>
  <text x="150" y="318" font-family="sans-serif" font-size="15" fill="#fff">🏆 Hadiah menarik</text>
  <text x="340" y="318" font-family="monospace" font-size="15" fill="#00d4ff">10 tim • live</text>
  <text x="150" y="340" font-family="sans-serif" font-size="12" fill="#bbb">Kompetisi coding 24 jam — kolaborasi &amp; networking</text>
</svg>
