<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Ilustrasi: Mobile App (Dart/Flutter) - 2 HP berdampingan -->
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#1a3a5a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)"/>
  <!-- Simbol Flutter segitiga -->
  <g opacity="0.12">
    <path d="M200 320 L300 80 L400 320 Z" fill="none" stroke="#42a5f5" stroke-width="18" stroke-linejoin="round"/>
  </g>
  <!-- HP kiri (iOS) -->
  <rect x="160" y="60" width="130" height="280" rx="22" fill="#0f0c29" stroke="#42a5f5" stroke-width="2.5"/>
  <rect x="200" y="72" width="50" height="10" rx="5" fill="#333"/>
  <rect x="175" y="100" width="100" height="88" rx="10" fill="#1e1e3a"/>
  <text x="225" y="125" text-anchor="middle" font-family="monospace" font-size="28" fill="#42a5f5">◈</text>
  <text x="225" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#bbb">Flutter</text>
  <text x="225" y="165" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#00d4ff">iOS • Android</text>
  <rect x="175" y="200" width="100" height="18" rx="9" fill="#00d4ff"/>
  <text x="225" y="213" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f0c29">Jalankan</text>
  <text x="225" y="270" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">Dart / Flutter</text>
  <!-- HP kanan (Android) - miring -->
  <g transform="rotate(6 360 200)">
    <rect x="310" y="50" width="130" height="280" rx="22" fill="#112233" stroke="#00d4ff" stroke-width="2.5"/>
    <rect x="350" y="62" width="50" height="10" rx="5" fill="#335"/>
    <text x="375" y="120" text-anchor="middle" font-family="monospace" font-size="12" fill="#7CFC98">Widget {</text>
    <text x="375" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffd343">  build() =&gt;</text>
    <text x="375" y="170" text-anchor="middle" font-family="monospace" font-size="11" fill="#8be9fd">  App()</text>
    <text x="375" y="195" text-anchor="middle" font-family="monospace" font-size="12" fill="#7CFC98">}</text>
    <rect x="325" y="220" width="100" height="18" rx="9" fill="#42a5f5"/>
    <text x="375" y="233" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">Build APK</text>
  </g>
</svg>
