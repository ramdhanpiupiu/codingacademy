<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Ilustrasi: Mentoring Karier IT - mentor & peserta -->
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a0f"/>
      <stop offset="1" stop-color="#1e3a2a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg6)"/>
  <!-- Simbol karier: tangga -->
  <g opacity="0.12">
    <rect x="160" y="300" width="80" height="18" fill="#00d4ff"/>
    <rect x="170" y="270" width="70" height="18" fill="#00d4ff"/>
    <rect x="180" y="240" width="60" height="18" fill="#00d4ff"/>
    <rect x="190" y="210" width="50" height="18" fill="#00d4ff"/>
    <rect x="200" y="180" width="40" height="18" fill="#00d4ff"/>
    <text x="205" y="155" font-family="sans-serif" font-size="30" fill="#ffd343">★</text>
  </g>
  <g opacity="0.12">
    <rect x="380" y="300" width="80" height="18" fill="#50fa7b"/>
    <rect x="370" y="270" width="70" height="18" fill="#50fa7b"/>
    <rect x="360" y="240" width="60" height="18" fill="#50fa7b"/>
  </g>
  <!-- Bubble mentor -->
  <rect x="70" y="50" width="220" height="130" rx="16" fill="#1e1e2c" stroke="#00d4ff" stroke-width="2.5"/>
  <polygon points="160,180 180,200 140,180" fill="#1e1e2c" stroke="#00d4ff" stroke-width="2.5"/>
  <text x="180" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#00d4ff">MENTOR</text>
  <text x="180" y="112" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">“Siap interview?”</text>
  <text x="180" y="135" text-anchor="middle" font-family="monospace" font-size="13" fill="#50fa7b">Portfolio ✓</text>
  <text x="180" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="#bbb">Karier jangka panjang</text>
  <!-- Bubble peserta -->
  <rect x="310" y="130" width="220" height="130" rx="16" fill="#0f0c29" stroke="#50fa7b" stroke-width="2.5"/>
  <polygon points="420,260 400,280 440,260" fill="#0f0c29" stroke="#50fa7b" stroke-width="2.5"/>
  <text x="420" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#50fa7b">PESERTA</text>
  <text x="420" y="192" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">CV &amp; LinkedIn</text>
  <text x="420" y="215" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffd343">Siap kerja!</text>
  <text x="420" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#bbb">Bimbingan 1-on-1</text>
  <!-- Dua avatar lingkaran -->
  <circle cx="180" cy="300" r="40" fill="#2a2a4a" stroke="#00d4ff" stroke-width="3"/>
  <text x="180" y="315" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#00d4ff">👨‍💻</text>
  <circle cx="420" cy="340" r="40" fill="#1a2a1a" stroke="#50fa7b" stroke-width="3"/>
  <text x="420" y="355" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#50fa7b">👩‍💻</text>
  <!-- Panah -->
  <text x="300" y="300" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#ffd343">→</text>
</svg>
